; Calls from Yemot (routing_ip) arrive here as plain SIP over UDP.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Phase 3 test: accept unmatched callers into a test-only context.
; Lock this to Yemot source IPs once the first call shows them.
[anonymous]
type=endpoint
context=to-openai
disallow=all
allow=alaw,ulaw
direct_media=no
dtmf_mode=auto

; Outbound to OpenAI Realtime SIP: TLS signalling + SRTP (SDES) media.
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
method=tlsv1_2
ca_list_file=/etc/ssl/certs/ca-certificates.crt
verify_server=yes
allow_wildcard_certs=yes

[openai]
type=aor
contact=sip:OPENAI_PROJECT_ID@sip.api.openai.com:5061;transport=tls

[openai]
type=endpoint
transport=transport-tls
aors=openai
context=from-openai
disallow=all
allow=ulaw,alaw
media_encryption=sdes
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes

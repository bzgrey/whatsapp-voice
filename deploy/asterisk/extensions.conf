[general]
static=yes
writeprotect=yes

; Test line: greeting, read back caller ID, then echo keypad digits.
[from-yemot]
exten => _[a-zA-Z0-9].,1,Verbose(1,Yemot call to ${EXTEN} from ${CALLERID(all)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,SayDigits(${CALLERID(num)})
 same => n(loop),Read(DIGITS,beep,1,,1,15)
 same => n,GotoIf($["${DIGITS}" = ""]?bye)
 same => n,Verbose(1,DTMF received: ${DIGITS})
 same => n,SayDigits(${DIGITS})
 same => n,Goto(loop)
 same => n(bye),Playback(vm-goodbye)
 same => n,Hangup()

; Yemot call -> OpenAI (caller ID passes through in From).
[to-openai]
exten => assistant,1,Verbose(1,Yemot -> OpenAI from ${CALLERID(num)})
 same => n,Dial(PJSIP/openai,60)
 same => n,Hangup()

[from-openai]
